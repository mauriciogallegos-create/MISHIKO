server.port=8080
spring.application.name=mishiko-backend

# DataSource MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/mishiko_db?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Context path
server.servlet.context-path=/api

# JWT
mishiko.jwt.secret=MishikoSecretKey2024SuperSeguraParaJWT256BitsMinimo!!
mishiko.jwt.expiration=86400000

# File Upload
mishiko.upload.dir=uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (also handled programmatically)
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500

# Logging
logging.level.com.mishiko=INFO
logging.level.org.springframework.security=WARN
