server.port=${PORT:8080}
spring.application.name=mishiko-backend

# DataSource H2 (Embebida y persistente en archivo ./data/mishikodb)
spring.datasource.url=jdbc:h2:file:./data/mishikodb;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Context path
server.servlet.context-path=/api

# JWT
mishiko.jwt.secret=MishikoSecretKey2024SuperSeguraParaJWT256BitsMinimo!!
mishiko.jwt.expiration=86400000

# File Upload
mishiko.upload.dir=uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (also handled programmatically)
spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500

# Logging
logging.level.com.mishiko=INFO
logging.level.org.springframework.security=WARN
