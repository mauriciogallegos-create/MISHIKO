services:
  mishiko:
    build:
      context: .
      dockerfile: Dockerfile
    image: mishiko:latest
    container_name: mishiko-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - mishiko_data:/app/data
      - mishiko_uploads:/app/uploads
    restart: unless-stopped

volumes:
  mishiko_data:
    name: mishiko_h2_data
  mishiko_uploads:
    name: mishiko_user_uploads
