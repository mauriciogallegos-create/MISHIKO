<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISHIKO – Seguimiento de Pedido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mishiko.css">
  <style>
    .seguimiento-container { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    .search-pedido { background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.5rem; }
    .search-pedido h2 { font-size: 1.1rem; margin-bottom: 1rem; }
    .search-row { display: flex; gap: 0.75rem; }
    .search-row input { flex: 1; }

    /* Timeline */
    .timeline { background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: var(--shadow); }
    .timeline-header { margin-bottom: 1.5rem; }
    .timeline-header h3 { font-size: 1rem; font-weight: 600; }
    .timeline-header .num-pedido { font-size: 1.3rem; font-weight: 800; color: var(--primary); font-family: monospace; }

    .timeline-steps { position: relative; padding-left: 2rem; }
    .timeline-steps::before {
      content: ''; position: absolute; left: 10px; top: 0; bottom: 0;
      width: 2px; background: #e2e8f0;
    }
    .tl-step { position: relative; padding: 0 0 1.5rem 1.5rem; }
    .tl-step:last-child { padding-bottom: 0; }
    .tl-dot {
      position: absolute; left: -2rem; top: 2px;
      width: 22px; height: 22px; border-radius: 50%;
      background: #e2e8f0; border: 3px solid #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; transition: all 0.3s;
    }
    .tl-step.done   .tl-dot { background: var(--success); }
    .tl-step.active .tl-dot { background: var(--primary); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

    .tl-label { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.2rem; }
    .tl-desc  { color: var(--text-muted); font-size: 0.82rem; }
    .tl-step.pending .tl-label { color: var(--text-muted); }

    .pedido-info { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #f0f0f0; }
    .info-row { display: flex; justify-content: space-between; padding: 0.4rem 0; font-size: 0.9rem; }
    .info-row strong { color: var(--primary); }

    .productos-list { margin-top: 1rem; }
    .prod-item { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #f5f5f5; font-size: 0.9rem; }
    .total-box { margin-top: 1rem; background: var(--primary-light); border-radius: 10px; padding: 1rem; }
    .total-box .total-row { font-size: 0.9rem; }

    .acciones-seguimiento { display: flex; gap: 0.75rem; margin-top: 1.25rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <a href="index.html" style="display:flex;align-items:center;gap:0.5rem;text-decoration:none;color:var(--primary)">
        <span>🐱</span><span class="logo-text">MISHIKO</span>
      </a>
    </div>
  </nav>

  <div class="seguimiento-container">
    <div class="search-pedido">
      <h2>🔍 Seguimiento de Pedido</h2>
      <div class="search-row">
        <input type="text" id="input-numero" class="form-control" placeholder="Ej: PED000001" style="text-transform:uppercase">
        <button class="btn btn-primary" onclick="buscarPedido()">Buscar</button>
      </div>
      <div id="search-error" style="color:var(--error);font-size:0.85rem;margin-top:0.5rem;display:none"></div>
    </div>

    <div id="resultado" style="display:none">
      <div class="timeline">
        <div class="timeline-header">
          <div style="color:var(--text-muted);font-size:0.85rem">N° de Pedido</div>
          <div class="num-pedido" id="res-numero">PED000001</div>
          <div style="margin-top:0.5rem">
            Estado actual: <span id="res-estado-badge" class="estado-badge estado-PENDIENTE">PENDIENTE</span>
          </div>
        </div>

        <!-- Timeline de estados -->
        <div class="timeline-steps" id="timeline-steps">
          <!-- Generado dinámicamente -->
        </div>

        <!-- Info del pedido -->
        <div class="pedido-info">
          <div class="info-row"><span>Mesa</span><strong id="res-mesa">-</strong></div>
          <div class="info-row"><span>Cliente</span><strong id="res-cliente">-</strong></div>
          <div class="info-row"><span>Hora del pedido</span><strong id="res-hora">-</strong></div>
        </div>

        <!-- Productos -->
        <div class="productos-list">
          <strong style="font-size:0.85rem;color:var(--text-muted)">PRODUCTOS</strong>
          <div id="res-productos"></div>
        </div>

        <!-- Totales -->
        <div class="total-box">
          <div class="total-row"><span>Subtotal</span><span id="res-subtotal">S/ 0.00</span></div>
          <div class="total-row"><span>IGV (18%)</span><span id="res-igv">S/ 0.00</span></div>
          <div class="total-row total-final"><span>Total</span><span id="res-total">S/ 0.00</span></div>
        </div>

        <div class="acciones-seguimiento">
          <button type="button" id="btn-avisos" class="btn btn-secondary" hidden>Activar notificaciones</button>
          <button class="btn btn-secondary" onclick="buscarPedido()" style="font-size:0.85rem">🔄 Actualizar</button>
          <a id="btn-ir-comprobante" href="#" class="btn btn-primary" style="font-size:0.85rem">📄 Ver Comprobante</a>
        </div>
      </div>
    </div>

    <!-- Michi flotante -->
    <div id="michi-flotante" class="michi-flotante">
      <div id="michi-burbuja" class="michi-burbuja" style="display:none">
        <p id="michi-msg">Buscando tu pedido... 🔍</p>
      </div>
      <button class="michi-btn" onclick="toggleMichi()">
        <canvas id="michi-canvas" width="80" height="80"></canvas>
      </button>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/michi.js"></script>
  <script>
    const ESTADOS_ORDEN = ['PENDIENTE','CONFIRMADO','EN_PREPARACION','LISTO','ENTREGADO'];
    const ESTADO_LABELS = {
      PENDIENTE:      { label: 'Pendiente',       desc: 'Tu pedido fue recibido.',              icon: '🕐' },
      CONFIRMADO:     { label: 'Confirmado',       desc: 'El restaurante confirmó tu pedido.',   icon: '✅' },
      EN_PREPARACION: { label: 'En Preparación',   desc: 'La cocina está preparando tu orden.', icon: '🍳' },
      LISTO:          { label: '¡Listo!',          desc: 'Tu pedido está listo para entregar.',  icon: '🎉' },
      ENTREGADO:      { label: 'Entregado',        desc: '¡Disfruta tu pedido!',                icon: '😋' },
      CANCELADO:      { label: 'Cancelado',        desc: 'El pedido fue cancelado.',             icon: '❌' }
    };

    let pedidoActual = null;
    let intervaloActualizacion = null;

    // Verificar si viene número en URL
    const params = new URLSearchParams(window.location.search);
    const numeroUrl = params.get('numero');
    if (numeroUrl) {
      document.getElementById('input-numero').value = numeroUrl;
      buscarPedido();
    }

    async function buscarPedido() {
      const numero = document.getElementById('input-numero').value.trim().toUpperCase();
      const errorEl = document.getElementById('search-error');
      errorEl.style.display = 'none';

      if (!numero) { errorEl.textContent = 'Ingresa el número de pedido.'; errorEl.style.display = 'block'; return; }

      try {
        const pedido = await api.get(`/pedidos/numero/${numero}`);
        if (pedido.estado !== pedidoActual?.estado || pedido.id !== pedidoActual?.id) {
          Notifications.notificarEstadoPedido(pedido.estado, pedido.numeroPedido);
        }
        pedidoActual = pedido;
        renderPedido(pedido);
        clearInterval(intervaloActualizacion);

        // Polling automático si pedido activo
        if (!['ENTREGADO','CANCELADO'].includes(pedido.estado)) {
          intervaloActualizacion = setInterval(actualizarEstado, 15000);
        }
      } catch (err) {
        errorEl.textContent = 'No se encontró el pedido. Verifica el número.';
        errorEl.style.display = 'block';
        document.getElementById('resultado').style.display = 'none';
      }
    }

    async function actualizarEstado() {
      if (!pedidoActual) return;
      try {
        const pedido = await api.get(`/pedidos/${pedidoActual.id}`);
        if (pedido.estado !== pedidoActual.estado) {
          Notifications.notificarEstadoPedido(pedido.estado, pedido.numeroPedido);
          const msgs = { LISTO: '¡Tu pedido está listo! 🎉', EN_PREPARACION: '¡Tu pedido está en preparación! 🍳', ENTREGADO: '¡Que lo disfrutes! 😋' };
          if (msgs[pedido.estado]) michiHabla(msgs[pedido.estado]);
        }
        pedidoActual = pedido;
        renderPedido(pedido);
        if (['ENTREGADO','CANCELADO'].includes(pedido.estado)) clearInterval(intervaloActualizacion);
      } catch (_) {}
    }

    function renderPedido(p) {
      document.getElementById('resultado').style.display = 'block';
      document.getElementById('res-numero').textContent = p.numeroPedido;

      const badgeEl = document.getElementById('res-estado-badge');
      badgeEl.textContent = ESTADO_LABELS[p.estado]?.label || p.estado;
      badgeEl.className = `estado-badge estado-${p.estado}`;

      document.getElementById('res-mesa').textContent    = p.mesaNumero ? `Mesa ${p.mesaNumero}` : '-';
      document.getElementById('res-cliente').textContent = p.nombreCliente || 'Anónimo';
      document.getElementById('res-hora').textContent    = p.createdAt ? new Date(p.createdAt).toLocaleString('es-PE') : '-';

      // Timeline
      const steps = document.getElementById('timeline-steps');
      const estadoIdx = ESTADOS_ORDEN.indexOf(p.estado);
      steps.innerHTML = ESTADOS_ORDEN.map((e, i) => {
        const info  = ESTADO_LABELS[e];
        const done  = i < estadoIdx;
        const activo= i === estadoIdx;
        return `<div class="tl-step ${done?'done':activo?'active':'pending'}">
          <div class="tl-dot">${done?'✓':info.icon}</div>
          <div class="tl-label">${info.label}</div>
          <div class="tl-desc">${info.desc}</div>
        </div>`;
      }).join('');

      // Productos
      document.getElementById('res-productos').innerHTML = (p.detalles || []).map(d =>
        `<div class="prod-item">
          <span>${d.cantidad}× ${escaparHtml(d.productoNombre)}${d.observaciones ? ` <small style="color:var(--text-muted)">(${escaparHtml(d.observaciones)})</small>` : ''}</span>
          <span>S/ ${parseFloat(d.subtotal).toFixed(2)}</span>
        </div>`).join('');

      document.getElementById('res-subtotal').textContent = `S/ ${parseFloat(p.subtotal||0).toFixed(2)}`;
      document.getElementById('res-igv').textContent      = `S/ ${parseFloat(p.igv||0).toFixed(2)}`;
      document.getElementById('res-total').textContent    = `S/ ${parseFloat(p.total||0).toFixed(2)}`;
      document.getElementById('btn-ir-comprobante').href  = `comprobante.html?pedidoId=${p.id}`;

    }

    Notifications.configurarBotonPermiso(document.getElementById('btn-avisos'));
  </script>
</body>
</html>
