<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISHIKO Admin – Productos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/mishiko.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">🐱 MISHIKO Admin</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="productos.html" class="active">🍽 Productos</a>
      <a href="categorias.html">📂 Categorías</a>
      <a href="pedidos.html">📋 Pedidos</a>
      <a href="mesas.html">🪑 Mesas</a>
      <a href="../cocina/consola.html">👨‍🍳 Cocina</a>
    </nav>
    <div style="padding:1rem 1.5rem;border-top:1px solid rgba(255,255,255,0.1)">
      <div style="font-size:0.82rem;color:rgba(255,255,255,0.6);margin-bottom:0.5rem" id="user-info">-</div>
      <button onclick="Auth.logout()" class="btn" style="background:rgba(255,107,53,0.2);color:#FF6B35;width:100%;font-size:0.82rem">Cerrar Sesión</button>
    </div>
  </aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <h2 style="font-size:1.1rem;font-weight:600">🍽 Gestión de Productos</h2>
      <button class="btn btn-primary" onclick="abrirModalNuevo()">+ Nuevo Producto</button>
    </div>
    <div class="admin-content">
      <div class="filter-bar">
        <input type="text" id="buscar" placeholder="🔍 Buscar producto..." oninput="filtrarProductos()">
        <select id="filtro-cat" onchange="filtrarProductos()">
          <option value="0">Todas las categorías</option>
        </select>
        <select id="filtro-disp" onchange="filtrarProductos()">
          <option value="">Todos</option>
          <option value="true">Disponibles</option>
          <option value="false">No disponibles</option>
        </select>
      </div>
      <div id="loading-prods" class="loading-container"><div class="spinner"></div><p>Cargando...</p></div>
      <div id="productos-grid" class="productos-admin-grid" style="display:none"></div>
    </div>
  </div>
</div>

<!-- Modal Producto -->
<div id="modal-producto" class="modal" style="display:none">
  <div class="modal-content" style="max-width:580px">
    <div class="modal-header">
      <h3 id="modal-titulo">Nuevo Producto</h3>
      <button class="btn-cerrar" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="prod-id">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nombre *</label>
          <input type="text" id="prod-nombre" class="form-control" placeholder="Nombre del producto">
        </div>
        <div class="form-group">
          <label class="form-label">Categoría *</label>
          <select id="prod-categoria" class="form-control">
            <option value="">Seleccionar...</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Descripción</label>
        <textarea id="prod-desc" class="form-control" rows="2" placeholder="Descripción del plato"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Precio (S/) *</label>
          <input type="number" id="prod-precio" class="form-control" placeholder="0.00" step="0.01" min="0">
        </div>
        <div class="form-group">
          <label class="form-label">URL de Imagen</label>
          <input type="text" id="prod-imagen" class="form-control" placeholder="https://..." oninput="previsualizarImg()">
        </div>
      </div>
      <div class="form-group">
        <div class="img-preview" id="img-preview">🍽</div>
      </div>
      <div style="display:flex;gap:1.5rem;align-items:center">
        <label class="toggle-disponible">
          <div class="toggle-switch">
            <input type="checkbox" id="prod-disponible" checked>
            <span class="toggle-slider"></span>
          </div>
          Disponible
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarProducto()" id="btn-guardar">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Confirmar Eliminar -->
<div id="modal-eliminar" class="modal" style="display:none">
  <div class="modal-content" style="max-width:380px">
    <div class="modal-body" style="text-align:center;padding:2rem">
      <div style="font-size:2.5rem;margin-bottom:1rem">🗑️</div>
      <h3>¿Eliminar producto?</h3>
      <p style="color:var(--text-muted);margin-top:0.5rem">Esta acción no se puede deshacer.</p>
      <div style="display:flex;gap:0.75rem;margin-top:1.5rem">
        <button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('modal-eliminar').style.display='none'">Cancelar</button>
        <button class="btn btn-danger" style="flex:1" onclick="confirmarEliminar()">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/notifications.js"></script>
<script>
  Auth.requireAuth(['ADMIN']);
  const user = Auth.getUser();
  if (user) document.getElementById('user-info').textContent = `${user.nombre} · ${user.rol}`;

  let productos = [], categorias = [], prodEliminarId = null;

  async function cargarDatos() {
    try {
      [productos, categorias] = await Promise.all([
        api.get('/productos?restauranteId=1'),
        api.get('/categorias?restauranteId=1')
      ]);
      poblarSelectCategorias();
      filtrarProductos();
    } catch(err) { mostrarToast('Error: ' + err.message, 'error'); }
    document.getElementById('loading-prods').style.display = 'none';
    document.getElementById('productos-grid').style.display = 'grid';
  }

  function poblarSelectCategorias() {
    const selFiltro = document.getElementById('filtro-cat');
    const selForm   = document.getElementById('prod-categoria');
    categorias.forEach(c => {
      selFiltro.add(new Option(c.nombre, c.id));
      selForm.add(new Option(c.nombre, c.id));
    });
  }

  function filtrarProductos() {
    const q    = document.getElementById('buscar').value.toLowerCase();
    const cat  = parseInt(document.getElementById('filtro-cat').value) || 0;
    const disp = document.getElementById('filtro-disp').value;
    const f = productos.filter(p => {
      const mQ = !q || p.nombre.toLowerCase().includes(q);
      const mC = !cat || p.categoriaId === cat;
      const mD = disp === '' || String(p.disponible) === disp;
      return mQ && mC && mD;
    });
    renderGrid(f);
  }

  function renderGrid(prods) {
    const grid = document.getElementById('productos-grid');
    grid.innerHTML = prods.map(p => `
      <div class="prod-admin-card">
        <div class="prod-admin-img">
          ${p.imagenUrl ? `<img src="${p.imagenUrl}" alt="${p.nombre}" onerror="this.parentElement.textContent='🍽'">` : '🍽'}
        </div>
        <div class="prod-admin-body">
          <div class="prod-admin-cat">${p.categoriaNombre || '-'}</div>
          <div class="prod-admin-nombre">${p.nombre}</div>
          <div class="prod-admin-precio">S/ ${parseFloat(p.precio).toFixed(2)}</div>
          <div style="font-size:0.78rem;margin-top:0.3rem">
            <span style="color:${p.disponible?'var(--success)':'var(--error)'}">● ${p.disponible?'Disponible':'No disponible'}</span>
          </div>
          <div class="prod-admin-actions">
            <button class="btn-accion btn-editar" onclick="editarProducto(${p.id})">✏ Editar</button>
            <button class="btn-accion btn-borrar" onclick="pedirEliminar(${p.id})">🗑</button>
          </div>
        </div>
      </div>`).join('') || '<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--text-muted)">No hay productos.</div>';
  }

  function abrirModalNuevo() {
    document.getElementById('modal-titulo').textContent = 'Nuevo Producto';
    document.getElementById('prod-id').value = '';
    document.getElementById('prod-nombre').value = '';
    document.getElementById('prod-desc').value = '';
    document.getElementById('prod-precio').value = '';
    document.getElementById('prod-imagen').value = '';
    document.getElementById('prod-categoria').value = '';
    document.getElementById('prod-disponible').checked = true;
    document.getElementById('img-preview').innerHTML = '🍽';
    document.getElementById('modal-producto').style.display = 'flex';
  }

  function editarProducto(id) {
    const p = productos.find(x => x.id === id);
    if (!p) return;
    document.getElementById('modal-titulo').textContent = 'Editar Producto';
    document.getElementById('prod-id').value         = p.id;
    document.getElementById('prod-nombre').value     = p.nombre;
    document.getElementById('prod-desc').value       = p.descripcion || '';
    document.getElementById('prod-precio').value     = p.precio;
    document.getElementById('prod-imagen').value     = p.imagenUrl || '';
    document.getElementById('prod-categoria').value  = p.categoriaId || '';
    document.getElementById('prod-disponible').checked = p.disponible;
    previsualizarImg();
    document.getElementById('modal-producto').style.display = 'flex';
  }

  function previsualizarImg() {
    const url = document.getElementById('prod-imagen').value;
    const preview = document.getElementById('img-preview');
    preview.innerHTML = url ? `<img src="${url}" onerror="this.parentElement.innerHTML='🍽'">` : '🍽';
  }

  async function guardarProducto() {
    const id       = document.getElementById('prod-id').value;
    const nombre   = document.getElementById('prod-nombre').value.trim();
    const catId    = document.getElementById('prod-categoria').value;
    const precio   = parseFloat(document.getElementById('prod-precio').value);

    if (!nombre || !catId || isNaN(precio) || precio <= 0) {
      mostrarToast('Completa nombre, categoría y precio.', 'warning'); return;
    }

    const payload = {
      nombre, categoriaId: parseInt(catId), restauranteId: 1,
      descripcion: document.getElementById('prod-desc').value,
      precio, imagenUrl: document.getElementById('prod-imagen').value || null,
      disponible: document.getElementById('prod-disponible').checked
    };

    try {
      if (id) {
        await api.put(`/admin/productos/${id}`, payload, true);
        mostrarToast('Producto actualizado', 'success');
      } else {
        await api.post('/admin/productos', payload, true);
        mostrarToast('Producto creado', 'success');
      }
      cerrarModal();
      cargarDatos();
    } catch(err) { mostrarToast('Error: ' + err.message, 'error'); }
  }

  function pedirEliminar(id) {
    prodEliminarId = id;
    document.getElementById('modal-eliminar').style.display = 'flex';
  }

  async function confirmarEliminar() {
    try {
      await api.delete(`/admin/productos/${prodEliminarId}`, true);
      mostrarToast('Producto eliminado', 'success');
      document.getElementById('modal-eliminar').style.display = 'none';
      cargarDatos();
    } catch(err) { mostrarToast('Error: ' + err.message, 'error'); }
  }

  function cerrarModal() { document.getElementById('modal-producto').style.display = 'none'; }

  cargarDatos();
</script>
</body>
</html>
