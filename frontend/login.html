<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MISHIKO – Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/mishiko.css">
  <style>
    body { background: linear-gradient(135deg, #FFF8F5 0%, #FFE0CC 100%); min-height: 100vh; display: flex; flex-direction: column; }
    .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .login-box {
      background: #fff; border-radius: 20px; padding: 2.5rem 2rem;
      width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(255,107,53,0.15);
    }
    .login-logo { text-align: center; margin-bottom: 1.5rem; }
    .login-logo .cat { font-size: 3.5rem; }
    .login-logo h1 { font-size: 1.8rem; font-weight: 800; color: var(--primary); letter-spacing: 1px; }
    .login-logo p { color: var(--text-muted); font-size: 0.9rem; }
    .login-title { font-size: 1.1rem; font-weight: 600; text-align: center; margin-bottom: 1.5rem; }
    .tab-group { display: flex; gap: 0; margin-bottom: 1.5rem; border: 2px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
    .tab-btn {
      flex: 1; padding: 0.6rem; background: none; border: none;
      font-family: var(--font); font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s; color: var(--text-muted);
    }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .error-msg { background: #FEE2E2; color: #991B1B; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.88rem; margin-bottom: 1rem; display: none; }
    .link-menu { text-align: center; margin-top: 1.25rem; font-size: 0.88rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <div class="login-logo">
        <div class="cat">🐱</div>
        <h1>MISHIKO</h1>
        <p>Panel de Administración</p>
      </div>

      <div class="tab-group">
        <button class="tab-btn active" onclick="showTab('login')">Iniciar Sesión</button>
        <button class="tab-btn" onclick="showTab('register')">Registrarse</button>
      </div>

      <!-- Login -->
      <div id="tab-login">
        <div class="error-msg" id="login-error"></div>
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input type="email" id="login-email" class="form-control" placeholder="admin@mishiko.com">
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-full" onclick="doLogin()" id="btn-login">
          Ingresar
        </button>
      </div>

      <!-- Register -->
      <div id="tab-register" style="display:none">
        <div class="error-msg" id="reg-error"></div>
        <div class="form-group">
          <label class="form-label">Nombre</label>
          <input type="text" id="reg-nombre" class="form-control" placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label class="form-label">Apellido</label>
          <input type="text" id="reg-apellido" class="form-control" placeholder="Tu apellido">
        </div>
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <input type="email" id="reg-email" class="form-control" placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Mínimo 6 caracteres">
        </div>
        <button class="btn btn-primary btn-full" onclick="doRegister()" id="btn-reg">
          Crear Cuenta
        </button>
      </div>

      <div class="link-menu">
        ¿Eres cliente? <a href="index.html">Ver Menú →</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    // Redirigir si ya está logueado
    if (Auth.isLoggedIn()) redirectByRole(Auth.getUser()?.rol);

    function showTab(tab) {
      document.getElementById('tab-login').style.display    = tab === 'login'    ? 'block' : 'none';
      document.getElementById('tab-register').style.display = tab === 'register' ? 'block' : 'none';
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', (i === 0) === (tab === 'login')));
    }

    async function doLogin() {
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errorEl  = document.getElementById('login-error');
      const btn      = document.getElementById('btn-login');

      if (!email || !password) { showError(errorEl, 'Completa todos los campos.'); return; }

      btn.disabled = true; btn.textContent = 'Ingresando...';
      errorEl.style.display = 'none';

      try {
        const res = await api.post('/auth/login', { email, password });
        Auth.setToken(res.token);
        Auth.setUser({ id: res.id, nombre: res.nombre, apellido: res.apellido, email: res.email, rol: res.rol });
        redirectByRole(res.rol);
      } catch (err) {
        showError(errorEl, err.message || 'Credenciales incorrectas.');
      } finally {
        btn.disabled = false; btn.textContent = 'Ingresar';
      }
    }

    async function doRegister() {
      const nombre   = document.getElementById('reg-nombre').value.trim();
      const apellido = document.getElementById('reg-apellido').value.trim();
      const email    = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const errorEl  = document.getElementById('reg-error');
      const btn      = document.getElementById('btn-reg');

      if (!nombre || !email || !password) { showError(errorEl, 'Completa los campos obligatorios.'); return; }
      if (password.length < 6)            { showError(errorEl, 'La contraseña debe tener al menos 6 caracteres.'); return; }

      btn.disabled = true; btn.textContent = 'Creando cuenta...';
      errorEl.style.display = 'none';

      try {
        const res = await api.post('/auth/register', { nombre, apellido, email, password });
        Auth.setToken(res.token);
        Auth.setUser({ id: res.id, nombre: res.nombre, apellido: res.apellido, email: res.email, rol: res.rol });
        redirectByRole(res.rol);
      } catch (err) {
        showError(errorEl, err.message || 'No se pudo crear la cuenta.');
      } finally {
        btn.disabled = false; btn.textContent = 'Crear Cuenta';
      }
    }

    function redirectByRole(rol) {
      if (!rol) return;
      if (rol === 'ADMIN' || rol === 'PERSONAL') window.location.href = 'admin/dashboard.html';
      else if (rol === 'COCINA')                 window.location.href = 'cocina/consola.html';
      else                                       window.location.href = 'index.html';
    }

    function showError(el, msg) { el.textContent = msg; el.style.display = 'block'; }

    // Enter key
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
